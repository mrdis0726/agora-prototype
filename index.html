nutesAgo:5,text:`Только сегодня! Электросамокаты за полцены, переходите по ссылке в профиле.`,likes:2,replies:0,topic:`реклама`,label:{labeler:`spam`,text:`Реклама, не относится к теме ленты`}},{id:4,author:`rayon`,minutesAgo:95,text:`Районный совет вынес на обсуждение проект велодорожки на Садовой улице. Итоговое решение примут через две недели.`,likes:230,replies:87,topic:`велосипед`,media:{type:`image`,src:`media/street.webp`,art:`street`,credit:`street`,alt:`Выделенная красная велополоса вдоль тротуара`}},{id:5,author:`oleg`,minutesAgo:150,text:`Утверждают, что велодорожка сократит дорогу на работу вдвое для всех жителей района. Это решит все проблемы с пробками!`,likes:480,replies:190,topic:`велосипед`,label:{labeler:`facts`,text:`Есть уточнение: оценка относится только к поездкам до 3 км`}},{id:6,author:`urban`,minutesAgo:300,text:`Выложили данные замеров трафика на Садовой за сентябрь. Таблица открыта, можно проверять и пересчитывать.`,likes:44,replies:9,topic:`данные`,media:{type:`image`,src:`media/counter.webp`,art:`chart`,credit:`counter`,alt:`Датчики учёта трафика, натянутые поперёк дороги`}},{id:7,author:`ilya`,minutesAgo:48,text:`Сегодня утром на Садовой снова пришлось объезжать автобус по тротуару. Отдельная полоса решила бы это.`,likes:37,replies:11,topic:`велосипед`,media:{type:`video`,src:`media/bus.mp4`,poster:`media/bus-poster.jpg`,art:`bus`,credit:`bus`,duration:`0:10`,alt:`Видео с велосипеда: поток машин на городской улице`}},{id:8,author:`garden`,minutesAgo:70,text:`В воскресенье сажаем чеснок под зиму. Нужны две лопаты и люди, которые умеют держать лопату.`,likes:52,replies:14,topic:`двор`,media:{type:`image`,src:`media/garden.webp`,art:`garden`,credit:`garden`,alt:`Деревянные грядки с зеленью во дворе`}},{id:9,author:`vera`,minutesAgo:125,text:`Подскажите, как в этой сети найти расписание библиотеки? Внучка установила, а я пока разбираюсь.`,likes:9,replies:6,topic:`библиотека`},{id:10,author:`coffee`,minutesAgo:20,text:`С понедельника открываемся в семь утра. Для тех, кто едет на работу на велосипеде, есть стойка у входа.`,likes:28,replies:4,topic:`район`,label:{labeler:`city`,text:`Проверено: часы работы подтвердила кофейня`},media:{type:`image`,src:`media/cafe.webp`,art:`cafe`,credit:`cafe`,alt:`Велосипед у входа в здание с белыми окнами`}},{id:11,author:`rayon`,minutesAgo:210,text:`Опрос недели: чего не хватает вашему двору? Ответы соберём в материал.`,likes:120,replies:64,topic:`район`},{id:12,author:`urban`,minutesAgo:420,text:`Открытая лекция «Как считают пешеходов» пройдёт в четверг в шесть вечера, аудитория 204.`,likes:31,replies:5,topic:`данные`},{id:13,author:`anna`,minutesAgo:260,text:`Спасибо всем, кто пришёл на субботний велопробег. Нас было сто двенадцать человек, никто не потерялся.`,likes:140,replies:26,topic:`велосипед`,media:{type:`video`,src:`media/ride.mp4`,poster:`media/ride-poster.jpg`,art:`ride`,credit:`ride`,duration:`0:10`,alt:`Видео с велосипеда: велодорожка за городом`}},{id:14,author:`oleg`,minutesAgo:330,text:`Парковку у поликлиники и так не найти. Уберут сорок мест, и куда ставить машину тем, кто везёт пожилых родителей?`,likes:95,replies:41,topic:`парковка`},{id:15,author:`library`,minutesAgo:380,text:`Получили новые детские книги. Список висит у входа и в закреплённом посте.`,likes:46,replies:2,topic:`библиотека`,media:{type:`image`,src:`media/books.webp`,art:`books`,credit:`books`,alt:`Полка с детскими книжками с картинками`}},{id:16,author:`sale24`,minutesAgo:40,text:`Заработок без вложений, пишите в личные сообщения.`,likes:1,replies:0,topic:`реклама`,label:{labeler:`base`,text:`Удалено базовой модерацией: мошенничество`}},{id:17,author:`garden`,minutesAgo:500,text:`Кто-то оставил в саду детскую лейку с жирафом. Лежит на скамейке, заберите.`,likes:33,replies:7,topic:`двор`,media:{type:`image`,src:`media/can.webp`,art:`can`,credit:`can`,alt:`Бирюзовая лейка на каменной плитке`}},{id:18,author:`ilya`,minutesAgo:560,text:`Посчитал по данным кафедры: в час пик на Садовой в
